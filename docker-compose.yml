
services:
  postgres:
    image: postgres:15-alpine
    container_name: todos-postgres
    environment:
      POSTGRES_USER: todos_user
      POSTGRES_PASSWORD: todos_pass
      POSTGRES_DB: todos_app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todos_user -d todos_app"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - todos-net
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: todos-backend
    environment:
      - DATABASE_URL=postgresql+psycopg://todos_user:todos_pass@postgres:5432/todos_app
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:5173,http://192.168.1.100:3001}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - todos-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: todos-frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    networks:
      - todos-net
    restart: unless-stopped

networks:
  todos-net:
    driver: bridge

volumes:
  postgres_data:
