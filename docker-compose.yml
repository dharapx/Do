
secrets:
  secret_key:
    file: ./backend/secrets/secret_key.txt
  github_client_id:
    file: ./backend/secrets/github_client_id.txt
  github_client_secret:
    file: ./backend/secrets/github_client_secret.txt
  google_client_id:
    file: ./backend/secrets/google_client_id.txt
  google_client_secret:
    file: ./backend/secrets/google_client_secret.txt

services:
  postgres:
    image: postgres:15-alpine
    container_name: todos-postgres
    command: >
      postgres
      -c max_connections=100
      -c shared_buffers=256MB
      -c work_mem=16MB
      -c effective_cache_size=1GB
    environment:
      POSTGRES_USER: todos_user
      POSTGRES_PASSWORD: todos_pass
      POSTGRES_DB: todos_app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todos_user -d todos_app"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - todos-net
    restart: unless-stopped

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: todos-pgbouncer
    environment:
      DATABASE_URL: postgresql://todos_user:todos_pass@postgres:5432/todos_app
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: 25
      MAX_CLIENT_CONN: 200
      AUTH_TYPE: scram-sha-256
    ports:
      - "6432:5432"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - todos-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: todos-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --save 60 1
    networks:
      - todos-net
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: todos-backend
    environment:
      - DATABASE_URL=postgresql+psycopg://todos_user:todos_pass@pgbouncer:5432/todos_app
      - REDIS_URL=redis://redis:6379/0
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:5173,http://192.168.1.100:3001}
      - OAUTH_REDIRECT_BASE=${OAUTH_REDIRECT_BASE:-http://localhost:8000}
      # OAuth — enable providers explicitly (requires client ID/secret in secrets)
      # - ENABLE_GITHUB_OAUTH=true
      # - ENABLE_GOOGLE_OAUTH=true
    secrets:
      - secret_key
      - github_client_id
      - github_client_secret
      - google_client_id
      - google_client_secret
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - todos-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: todos-frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    networks:
      - todos-net
    restart: unless-stopped

networks:
  todos-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
