services:
  postgres:
    image: postgres:15-alpine
    container_name: todos-postgres
    command: >
      postgres
      -c max_connections=100
      -c shared_buffers=256MB
      -c work_mem=16MB
      -c effective_cache_size=1GB
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      # Using $$ escapes the variable so it evaluates inside the container
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - todos-net
    restart: unless-stopped

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: todos-pgbouncer
    environment:
      # Injected variables directly into the connection string
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: 25
      MAX_CLIENT_CONN: 200
      AUTH_TYPE: scram-sha-256
    expose:
      - "5432"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - todos-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: todos-redis
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --save 60 1
    networks:
      - todos-net
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: todos-backend
    expose:
      - "8000"
    environment:
      # Backend connection string fully parameterized
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - CORS_ORIGINS=${CORS_ORIGINS:-https://do.dharapx.work}
      - OAUTH_REDIRECT_BASE=${OAUTH_REDIRECT_BASE:-https://do.dharapx.work}
      - FRONTEND_URL=${FRONTEND_URL:-https://do.dharapx.work}
      - SECRET_KEY=${SECRET_KEY}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.todos-backend.rule=Host(`do.dharapx.work`) && PathPrefix(`/api/v1`, `/docs`, `/redoc`, `/openapi.json`)"
      - "traefik.http.routers.todos-backend.entrypoints=web"
      - "traefik.http.services.todos-backend.loadbalancer.server.port=8000"
      - "traefik.docker.network=dokploy-network"
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - todos-net
      - dokploy-network
    restart: unless-stopped
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-/api/v1}
    container_name: todos-frontend
    expose:
      - "3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-/api/v1}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.todos-frontend.rule=Host(`do.dharapx.work`)"
      - "traefik.http.routers.todos-frontend.entrypoints=web"
      - "traefik.http.services.todos-frontend.loadbalancer.server.port=3000"
      - "traefik.docker.network=dokploy-network"
    depends_on:
      - backend
    networks:
      - todos-net
      - dokploy-network
    restart: unless-stopped

networks:
  todos-net:
    driver: bridge
  dokploy-network:
    external: true

volumes:
  postgres_data:
  redis_data:
  uploads_data:
