# For local dev, replace `expose:` with `ports:` (e.g. "5432:5432") for the
# services you need to access from the host directly.
services:
  postgres:
    image: postgres:15-alpine
    container_name: todos-postgres
    command: >
      postgres
      -c max_connections=100
      -c shared_buffers=256MB
      -c work_mem=16MB
      -c effective_cache_size=1GB
    environment:
      POSTGRES_USER: todos_user
      POSTGRES_PASSWORD: todos_pass
      POSTGRES_DB: todos_app
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todos_user -d todos_app"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - todos-net
    restart: unless-stopped

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: todos-pgbouncer
    environment:
      DATABASE_URL: postgresql://todos_user:todos_pass@postgres:5432/todos_app
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: 25
      MAX_CLIENT_CONN: 200
      AUTH_TYPE: scram-sha-256
    expose:
      - "5432"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - todos-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: todos-redis
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --save 60 1
    networks:
      - todos-net
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: todos-backend
    expose:
      - "8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://todos_user:todos_pass@pgbouncer:5432/todos_app
      - REDIS_URL=redis://redis:6379/0
      - CORS_ORIGINS=${CORS_ORIGINS:-https://do.dharapx.work}
      - OAUTH_REDIRECT_BASE=${OAUTH_REDIRECT_BASE:-https://do.dharapx.work}
      - FRONTEND_URL=${FRONTEND_URL:-https://do.dharapx.work}
      - SECRET_KEY=${SECRET_KEY}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`do.dharapx.work`) && PathPrefix(`/api/v1`, `/docs`, `/redoc`, `/openapi.json`)"
      - "traefik.http.routers.backend.entrypoints=web"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - todos-net
    restart: unless-stopped
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: todos-frontend
    expose:
      - "3000"
    environment:
      - NEXT_PUBLIC_API_URL=/api/v1
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`do.dharapx.work`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
    depends_on:
      - backend
    networks:
      - todos-net
    restart: unless-stopped

networks:
  todos-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  uploads_data:
