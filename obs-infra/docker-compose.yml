# obs-infra/docker-compose.yml
# Top-level orchestration - deploys full observability platform
# Usage: cd obs-infra && docker compose up -d

services:
  # Core observability stack
  prometheus:
    extends:
      file: ./prometheus/docker-compose.yml
      service: prometheus

  loki:
    extends:
      file: ./loki/docker-compose.yml
      service: loki

  tempo:
    extends:
      file: ./tempo/docker-compose.yml
      service: tempo

  grafana:
    extends:
      file: ./grafana/docker-compose.yml
      service: grafana

  otel-collector:
    extends:
      file: ./otel-collector/docker-compose.yml
      service: otel-collector

  # Infrastructure monitoring
  node-exporter:
    extends:
      file: ./node-exporter/docker-compose.yml
      service: node-exporter

  cadvisor:
    extends:
      file: ./cadvisor/docker-compose.yml
      service: cadvisor

  blackbox-exporter:
    extends:
      file: ./blackbox-exporter/docker-compose.yml
      service: blackbox-exporter

  # Security scanning (run via cron, not persistent)
  trivy:
    extends:
      file: ./trivy/docker-compose.yml
      service: trivy
    profiles: ["security-scan"]

networks:
  obs-net:
    external: true
  # Connect to existing app network (add when app exporters deployed)
  # todos-net:
  #   external: true

volumes:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
  trivy-cache: