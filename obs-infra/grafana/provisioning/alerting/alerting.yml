apiVersion: 1

alerting:
  contactpoints:
    - name: 'default'
      type: 'webhook'
      disableResolveMessage: false
      settings:
        url: http://localhost:9999/placeholder
        httpMethod: POST
      # Replace with your actual webhook URL to enable notifications:
      # type: 'slack'
      # settings:
      #   url: https://hooks.slack.com/services/xxx/yyy/zzz
      # --- or ---
      # type: 'discord'
      # settings:
      #   url: https://discord.com/api/webhooks/xxx/yyy

  notification_policies:
    - receiver: 'default'
      group_by: ['alertname', 'severity']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
