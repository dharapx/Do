# obs-infra/loki/docker-compose.yml
# Log aggregation - single binary mode
# Resources: 0.5 CPU, 1.5 GB RAM, 100 GB storage

services:
  loki:
    image: grafana/loki:2.9.0
    container_name: obs-loki
    command:
      - '-config.file=/etc/loki/loki-config.yml'
    expose:
      - "3100"
    volumes:
      - ./loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1.5G
        reservations:
          cpus: '0.25'
          memory: 768M
    networks:
      - obs-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  obs-net:
    external: true

volumes:
  loki-data: