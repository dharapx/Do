# obs-infra/prometheus/prometheus.yml
# Optimized for 3 CPU / 5 users - 30s scrape intervals

global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    environment: 'production'
    cluster: 'on-prem'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - "rules/*.yml"

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Backend API (FastAPI)
  - job_name: 'backend'
    scrape_interval: 30s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['todos-backend:8000']
        labels:
          service: 'todo-backend'
          environment: 'production'

  # Frontend (Next.js via OTel Collector)
  - job_name: 'frontend'
    scrape_interval: 60s
    static_configs:
      - targets: ['otel-collector:9464']
        labels:
          service: 'todo-frontend'
          environment: 'production'

  # OTel Collector metrics
  - job_name: 'otel-collector'
    scrape_interval: 30s
    static_configs:
      - targets: ['otel-collector:8888']
        labels:
          service: 'otel-collector'

  # Infrastructure
  - job_name: 'node-exporter'
    scrape_interval: 30s
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'node-exporter'

  - job_name: 'cadvisor'
    scrape_interval: 60s
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: 'cadvisor'

  # Database
  - job_name: 'postgres'
    scrape_interval: 30s
    static_configs:
      - targets: ['todos-postgres:9187']
        labels:
          service: 'postgres'

  - job_name: 'pgbouncer'
    scrape_interval: 30s
    static_configs:
      - targets: ['todos-pgbouncer:9127']
        labels:
          service: 'pgbouncer'

  - job_name: 'redis'
    scrape_interval: 30s
    static_configs:
      - targets: ['todos-redis:9121']
        labels:
          service: 'redis'

  # Blackbox probing
  - job_name: 'blackbox'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
        - https://do.dharapx.work
        - https://do.dharapx.work/api/v1/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115