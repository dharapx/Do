# Sigstore stack - requires authentication for most components
# This file is kept for reference but services require ghcr.io authentication
# 
# For local development, use local cosign keys (sbom/keys/) instead
# See sbom/scripts/security-scan.sh for local signing/verification

# services:
#   # Dex - OpenID Connect Identity Provider (requires config)
#   # dex:
#   #   image: ghcr.io/dexidp/dex:v2.39.0
#   #   ...
# 
#   # Fulcio - Certificate Authority (requires auth on ghcr.io)
#   # fulcio:
#   #   image: ghcr.io/sigstore/fulcio:v1.7.0
#   #   ...
# 
#   # CT Log - Certificate Transparency Log (requires auth on ghcr.io)
#   # ctlog:
#   #   image: ghcr.io/sigstore/ctlog:v1.7.0
#   #   ...
# 
#   # Rekor - Transparency Log (requires auth on ghcr.io)
#   # rekor:
#   #   image: ghcr.io/sigstore/rekor:v1.7.0
#   #   ...
# 
#   # Trillian - Log Server (requires auth on ghcr.io)
#   # trillian:
#   #   image: ghcr.io/sigstore/trillian:v1.7.0
#   #   ...

# networks:
#   sigstore-net:
#     driver: bridge